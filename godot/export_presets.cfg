; Android export preset for the Godot port (configuration only in this milestone: no APK has been
; built or installed; export templates and the signing identity are M9 work). Package id, minimum
; SDK and portrait orientation follow ARCHITECTURE.md §18; the label is the Capacitor app_name
; (android/app/src/main/res/values/strings.xml). OFL.txt ships with the bitmap font. No keystore
; paths or passwords here.

