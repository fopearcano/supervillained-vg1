# PROPOSAL — NOT ACTIVE. GitHub only runs workflows under .github/workflows/, which is outside the
# paths MILESTONES.md common gate 5 allows. To enable it, the architect approves the exception, the
# file moves to .github/workflows/godot-port-windows.yml and godot/tools/source_tree_guard.sh lists
# that path as an approved exception (deviation D-15 in IMPLEMENTATION_LOG.md).
#
# Windows evidence for the Godot port (docs/porting/IMPLEMENTATION_LOG.md). Runs the documented
# Windows commands on a GitHub-hosted Windows runner, whose Git checks text files out with CRLF
# (core.autocrlf=true), i.e. a Windows clean clone:
#   1. godot/tools/build_assets.ps1 -Godot <Godot_v4.7.2-stable_win64_console.exe> -Check
#   2. the Godot 4.7.2 Windows console test suite (and the 600-frame Main run)
# Godot is the official 4.7.2 release, verified against the release's SHA512-SUMS.txt. Nothing is
# built for distribution and nothing is published; the test results are kept as an artifact.
name: Godot port (Windows)

on:
  workflow_dispatch:
  push:
    branches: ['claude/gallant-keller-rbvtvy']
    paths:
      - 'godot/**'
      - '.github/workflows/godot-port-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Git line-ending configuration of the runner
        run: git config --show-origin --get-all core.autocrlf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the extractor reads the audited commit's Git blobs

      - name: Checkout line endings (CRLF source, LF Godot text)
        run: |
          $crlf = (git ls-files 'src/*.ts' | Where-Object { (Get-Content -Raw -LiteralPath $_) -match "`r`n" }).Count
          # (godot/assets/environment/manifest.json is a verbatim CRLF blob, binary on purpose)
          $godotCrlf = (git ls-files 'godot/*.gd' 'godot/*.tres' 'godot/*.tscn' | Where-Object { (Get-Content -Raw -LiteralPath $_) -match "`r`n" }).Count
          "source .ts files with CRLF: $crlf; Godot text files with CRLF: $godotCrlf"
          if ($godotCrlf -ne 0) { throw 'Godot text must stay LF (godot/.gitattributes)' }

      - uses: actions/setup-node@v4
        with:
          node-version-file: godot/tools/.node-version

      - name: npm ci and the lockfile's Playwright Chromium
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          exit $LASTEXITCODE

      - name: Godot 4.7.2 (official release, SHA-512 verified)
        run: |
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $zip = 'Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest "$base/$zip" -OutFile "$env:RUNNER_TEMP\$zip"
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile "$env:RUNNER_TEMP\SHA512-SUMS.txt"
          $want = ((Get-Content "$env:RUNNER_TEMP\SHA512-SUMS.txt" | Where-Object { $_ -match "\s$([regex]::Escape($zip))$" }) -split '\s+')[0]
          $got = (Get-FileHash "$env:RUNNER_TEMP\$zip" -Algorithm SHA512).Hash.ToLower()
          if (-not $want -or $got -ne $want) { throw "SHA-512 mismatch for ${zip}: $got vs $want" }
          Expand-Archive "$env:RUNNER_TEMP\$zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          "GODOT=$env:RUNNER_TEMP\godot\Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV
          "SHA-512 OK: $got"

      - name: Asset check (documented PowerShell command)
        run: |
          node --version
          pwsh godot/tools/build_assets.ps1 -Godot $env:GODOT -Check
          exit $LASTEXITCODE

      - name: Godot Windows console suite
        run: |
          & $env:GODOT --headless --path godot --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT --headless --path godot --script res://tests/test_runner.gd -- --suite all
          exit $LASTEXITCODE

      - name: 600-frame Main run
        run: |
          & $env:GODOT --headless --path godot --quit-after 600 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bad = $log | Where-Object { "$_" -match '^(ERROR|WARNING|SCRIPT ERROR)' }
          if ($bad) { $bad; throw 'engine errors or warnings in the 600-frame run' }

      - name: Working tree unchanged by the checks
        run: |
          $changes = git status --porcelain
          if ($changes) { $changes; throw 'the checks modified tracked files' }
          'clean'

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-port-windows-test-results
          path: godot/test-results/
          if-no-files-found: warn
